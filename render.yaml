# Render Blueprint.
#
# This file is set up for the FREE web plan. Two things make that work for an
# autonomous agent:
#
#   1. Durable memory lives in Postgres (for example Neon's free tier), set as
#      DATABASE_URL. The web instance's own filesystem is temporary, so the
#      training-day agent refuses to run on a public deployment without
#      DATABASE_URL: /health reports "degraded" with the reason, the tick
#      endpoint returns 503, and the console shows the agent as blocked.
#   2. The service sleeps after 15 minutes without traffic. GitHub Actions calls
#      the signed /internal/agent/tick endpoint every ten minutes, so check-ins
#      and follow-ups still happen on time (.github/workflows/agent-tick.yml).
#
# The training-day agent is the only sender of proactive check-ins. The legacy
# morning scheduler stays switched off.
services:
  - type: web
    name: training-log-agent
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      # --- Layer 1: the parser -------------------------------------------
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash

      # --- Permanent demo channel: Telegram --------------------------------
      # Create the bot in @BotFather. Startup registers the webhook automatically.
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_BOT_USERNAME
        sync: false
      - key: TELEGRAM_WEBHOOK_SECRET
        generateValue: true
      - key: TELEGRAM_LINK_SECRET
        generateValue: true

      # --- Channel: Vonage WhatsApp Sandbox -------------------------------
      # Configure once and the real WhatsApp transport activates automatically.
      - key: VONAGE_API_KEY
        sync: false
      - key: VONAGE_API_SECRET
        sync: false
      - key: VONAGE_SANDBOX_NUMBER
        sync: false
      - key: VONAGE_WEBHOOK_SECRET
        generateValue: true

      # --- Legacy fallback: Twilio WhatsApp -------------------------------
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_WHATSAPP_FROM
        value: whatsapp:+14155238886
      - key: PUBLIC_BASE_URL
        sync: false
      - key: VALIDATE_TWILIO_SIGNATURE
        value: "true"

      # --- Layer 4: the coach console -------------------------------------
      - key: COACH_NAME
        sync: false
      - key: COACH_DRAFT_HOUR
        value: "20"
      - key: COACH_SILENT_AFTER_DAYS
        value: "7"

      # --- The training-day agent -----------------------------------------
      # It ticks every minute while awake. GitHub Actions calls the signed
      # /internal/agent/tick endpoint every ten minutes so the free service's
      # sleep never stops a check-in (see .github/workflows/agent-tick.yml).
      - key: ENABLE_AGENT_LOOP
        value: "true"
      - key: AGENT_TICK_SECRET
        generateValue: true
      # Signs the 15-minute console links the bot sends to the coach chat.
      - key: COACH_LINK_SECRET
        generateValue: true
      # One-time code the coach sends as "/coach <code>" to link Telegram.
      - key: COACH_SETUP_CODE
        generateValue: true

      # --- Legacy morning scheduler ---------------------------------------
      # Off: the training-day agent owns every proactive check-in. It is also
      # never started while ENABLE_AGENT_LOOP is true, whatever this says.
      - key: ENABLE_MORNING_SCHEDULER
        value: "false"

      # --- Optional: calendar and travel planning -------------------------
      # Leave unset to run without them. Saved locations are refused entirely
      # unless CALENDAR_TOKEN_ENCRYPTION_KEY is configured.
      - key: GOOGLE_CALENDAR_CLIENT_ID
        sync: false
      - key: GOOGLE_CALENDAR_CLIENT_SECRET
        sync: false
      - key: GOOGLE_MAPS_API_KEY
        sync: false
      - key: OAUTH_STATE_SECRET
        generateValue: true
      - key: CALENDAR_TOKEN_ENCRYPTION_KEY
        sync: false

      # --- Layer 2: storage (REQUIRED) -------------------------------------
      # Postgres connection string, e.g. from a Neon project:
      #   postgresql://user:password@host/dbname?sslmode=require
      # Without it the training-day agent stays blocked on this deployment.
      - key: DATABASE_URL
        sync: false
